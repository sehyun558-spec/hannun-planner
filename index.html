<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preload" href="./fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#faf8f5" />
    <!-- 첫 화면이 그려지기 전에 저장된 테마와 시간대 배경을 정해요 (깜빡임 방지)
         색 표는 빌드할 때 src/data/themes.ts 에서 자동으로 채워져요 -->
    <script>
      ;(function () {
        try {
          var table = __THEME_TABLE__
          var theme = __DEFAULT_THEME__
          try {
            var saved = JSON.parse(localStorage.getItem('hannun-planner:settings') || '{}').colorTheme
            if (saved && table[saved]) theme = saved
          } catch (e) {}
          var v = new URLSearchParams(location.search).get('daypart')
          var h = new Date().getHours()
          var d = v === 'morning' || v === 'day' || v === 'evening' ? v : h >= 6 && h < 11 ? 'morning' : h >= 11 && h < 18 ? 'day' : 'evening'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.setAttribute('data-daypart', d)
          var c = table[theme][{ morning: 0, day: 1, evening: 2 }[d]]
          document.querySelector('meta[name="theme-color"]').setAttribute('content', c)
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="일정, 할 일, 메모를 한눈에. 광고 없고 내 폰에만 저장되는 플래너" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 아이폰 홈 화면 설치용 -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="한눈 플래너" />
    <title>한눈 플래너</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
